services:
  agentic-quality-copilot:
    build:
      context: .
      dockerfile: Dockerfile

    image: agentic-quality-investigation-copilot:1.3

    container_name: agentic-quality-copilot

    ports:
      - "8001:8001"

    environment:
      QUALITY_RISK_API_URL: http://host.docker.internal:8000/predict
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      MLFLOW_EXPERIMENT: agentic-quality-investigation
      CHECKPOINT_DB_PATH: /app/data/checkpoints/investigations.db

    volumes:
      - agentic-quality-checkpoints:/app/data/checkpoints

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  agentic-quality-checkpoints:
    name: agentic-quality-checkpoints