name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"

      QUALITY_RISK_API_URL: http://127.0.0.1:8000/predict
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      MLFLOW_EXPERIMENT: agentic-quality-investigation

      CHECKPOINT_DB_PATH: data/checkpoints/ci-investigations.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: >
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch

      - name: Install project dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Create runtime directories
        run: mkdir -p data/checkpoints

      - name: Verify application imports
        run: |
          python -c "import src; print('src import OK')"
          python -c "from api.main import app; print('API import OK')"

      - name: Run test suite
        run: python -m pytest -q -m "not integration"